name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Run shellcheck via uv
        run: |
          uv tool run --from shellcheck-py shellcheck \
            lib/pi-health.sh \
            checks/*.sh \
            install.sh uninstall.sh \
            tests/integration/run.sh

  bats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Run bats unit tests
        run: ./tests/bats/bin/bats tests/unit/

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run privileged-container integration test
        run: ./tests/integration/run.sh
